name: Bootstrap source import

on:
  push:
    paths:
      - "bootstrap/source.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and extract source archive
        shell: pwsh
        run: |
          $base64File = Join-Path $PWD "bootstrap\source.b64"
          if (-not (Test-Path -LiteralPath $base64File)) {
            throw "bootstrap/source.b64 not found"
          }
          $archive = Join-Path $PWD "bootstrap\xExcel-Viewer-2.5.13.zip"
          $bytes = [Convert]::FromBase64String((Get-Content -LiteralPath $base64File -Raw))
          [IO.File]::WriteAllBytes($archive, $bytes)

          $temp = Join-Path $PWD "_import"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $temp -Force
          $source = Join-Path $temp "xExcel-Viewer-2.5.13"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Expected xExcel-Viewer-2.5.13 folder not found in archive"
          }
          Get-ChildItem -LiteralPath $source -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $PWD -Recurse -Force
          }
          Remove-Item -LiteralPath $temp -Recurse -Force
          Remove-Item -LiteralPath (Join-Path $PWD "bootstrap") -Recurse -Force
          Remove-Item -LiteralPath (Join-Path $PWD ".github\workflows\bootstrap-import.yml") -Force

      - name: Commit imported source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            Write-Host "No source changes to commit."
          } else {
            git commit -m "Import xExcel Viewer 2.5.13 source"
            git push origin HEAD:main
          }
