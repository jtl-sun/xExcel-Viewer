name: Bootstrap source import

on:
  push:
    paths:
      - "bootstrap/chunk*.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and extract source archive
        id: rebuild
        shell: pwsh
        run: |
          $chunks = @(Get-ChildItem -LiteralPath (Join-Path $PWD "bootstrap") -Filter "chunk*.txt" | Sort-Object Name)
          if ($chunks.Count -ne 9) {
            Write-Host "Waiting for all 9 source chunks. Current count: $($chunks.Count)"
            "ready=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "ready=true" >> $env:GITHUB_OUTPUT
          $base64File = Join-Path $PWD "bootstrap\source.b64"
          $archive = Join-Path $PWD "bootstrap\xExcel-bootstrap.zip"
          $chunks | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() } |
            Set-Content -LiteralPath $base64File -NoNewline -Encoding Ascii
          $bytes = [Convert]::FromBase64String((Get-Content -LiteralPath $base64File -Raw))
          [IO.File]::WriteAllBytes($archive, $bytes)

          $expected = "6225c5f3a4935e20cf37f6938e7d7abe3bde86b49d34f527d4aebac6e8376b8a"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Bootstrap ZIP SHA256 mismatch: $actual" }

          $temp = Join-Path $PWD "_import"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $temp -Force
          Get-ChildItem -LiteralPath $temp -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $PWD -Recurse -Force
          }
          Remove-Item -LiteralPath $temp -Recurse -Force
          Remove-Item -LiteralPath (Join-Path $PWD "bootstrap") -Recurse -Force
          Remove-Item -LiteralPath (Join-Path $PWD ".github\workflows\bootstrap-import.yml") -Force

      - name: Commit imported source
        if: steps.rebuild.outputs.ready == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            Write-Host "No source changes to commit."
          } else {
            git commit -m "Import complete xExcel Viewer 2.5.13 source"
            git push origin HEAD:main
          }
