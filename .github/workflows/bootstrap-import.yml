name: Bootstrap source import

on:
  push:
    paths:
      - "bootstrap/part*.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and extract source archive
        id: rebuild
        shell: pwsh
        run: |
          $parts = @(Get-ChildItem -LiteralPath (Join-Path $PWD "bootstrap") -Filter "part*.txt" | Sort-Object Name)
          if ($parts.Count -ne 18) {
            Write-Host "Waiting for all 18 source parts. Current count: $($parts.Count)"
            "ready=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "ready=true" >> $env:GITHUB_OUTPUT
          $base64File = Join-Path $PWD "bootstrap\source.b64"
          $archive = Join-Path $PWD "bootstrap\xExcel-Viewer-2.5.13.zip"
          $parts | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw } |
            Set-Content -LiteralPath $base64File -NoNewline -Encoding Ascii
          $bytes = [Convert]::FromBase64String((Get-Content -LiteralPath $base64File -Raw))
          [IO.File]::WriteAllBytes($archive, $bytes)

          $expected = "b1f6f8479d1a9c8f00ba7ee1095ea3254b7ada2d3ce6a485b6b105688043d076"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source ZIP SHA256 mismatch: $actual" }

          $temp = Join-Path $PWD "_import"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $temp -Force
          $source = Join-Path $temp "xExcel-Viewer-2.5.13"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Expected xExcel-Viewer-2.5.13 folder not found in archive"
          }
          Get-ChildItem -LiteralPath $source -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $PWD -Recurse -Force
          }
          Remove-Item -LiteralPath $temp -Recurse -Force
          Remove-Item -LiteralPath (Join-Path $PWD "bootstrap") -Recurse -Force
          Remove-Item -LiteralPath (Join-Path $PWD ".github\workflows\bootstrap-import.yml") -Force

      - name: Commit imported source
        if: steps.rebuild.outputs.ready == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            Write-Host "No source changes to commit."
          } else {
            git commit -m "Import xExcel Viewer 2.5.13 source"
            git push origin HEAD:main
          }
